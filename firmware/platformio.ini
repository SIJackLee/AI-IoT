; 스마트팜 AI-IoT 연수 — PlatformIO 펌웨어 템플릿
; Cursor에서 PlatformIO 확장으로 Build / Upload 가능

[platformio]
default_envs = uno

; --- Arduino Uno (입문/제어 기초) ---
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; --- ESP32 (IoT / Wi-Fi / MQTT 실습용) ---
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
