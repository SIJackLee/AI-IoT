; 스마트팜 AI-IoT 연수 — PlatformIO
; 컨트롤보드: ESP32-WROOM-32E (MGN4)
; 작업 포트: COM3 (USB-SERIAL CH340)

[platformio]
default_envs = esp32_wroom_32e

; --- ESP32-WROOM-32E (MGN4) — 기본 ---
[env:esp32_wroom_32e]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_port = COM3
monitor_port = COM3
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D AIOT_BOARD_ESP32_WROOM_32E
  -D AIOT_PORT_COM3
  -I include
lib_deps =
  knolleary/PubSubClient @ ^2.8
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
  beegee-tokyo/DHT sensor library for ESPx @ ^1.19

; --- Arduino Uno (보조/레거시) ---
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
